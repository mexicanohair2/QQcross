<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060f">
<meta name="description" content="QQcross — играй в сканворды">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css?v=20261105-auth-scroll-fix">
<title>QQcross</title>
</head>
<body>
<div id="app"><div class="boot-splash"><div class="boot-logo">QQ</div><p>Загрузка игры…</p></div></div>
<script>
(function(){
  function showBootError(message){
    var root=document.getElementById("app");
    if(!root || !root.textContent.includes("Загрузка игры")) return;
    root.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#08060f;color:#e5dce0;font:16px system-ui;text-align:center"><div><div style="font-size:42px;font-weight:800;color:#b9a4ed">QQ</div><h2>Не удалось запустить QQcross</h2><p style="color:#b9b2c5;max-width:320px">'+String(message||"Скрипт игры не запустился").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})+'</p><button onclick="location.reload()" style="border:0;border-radius:12px;padding:13px 22px;background:#8b70c9;color:#f0e5e8;font-weight:700">Обновить игру</button></div></div>';
  }
  window.addEventListener("error",function(e){showBootError(e.message+" ("+(e.filename||"")+(e.lineno?":"+e.lineno:"")+")")});
  window.addEventListener("unhandledrejection",function(e){var r=e.reason;showBootError(r&&r.message?r.message:String(r||"Ошибка запуска"))});
  setTimeout(function(){showBootError("Игра не завершила запуск за 8 секунд. Возможно, не загрузился один из файлов.")},8000);
})();
</script>
<script type="module">
(async function(){
  var appVersion="20261105-auth-module-loader";
  function startApp(){
    if(document.querySelector('script[data-qq-app]'))return;
    var app=document.createElement("script");
    app.src="./app.js?v="+appVersion;
    app.dataset.qqApp="true";
    document.body.appendChild(app);
  }
  function loadUmd(index){
    var urls=[
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js",
      "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"
    ];
    if(index>=urls.length){
      window.QQ_SUPABASE_LOAD_ERROR=true;
      startApp();
      return;
    }
    var script=document.createElement("script");
    script.src=urls[index];
    script.onload=function(){
      if(window.supabase&&typeof window.supabase.createClient==="function")startApp();
      else loadUmd(index+1);
    };
    script.onerror=function(){loadUmd(index+1)};
    document.head.appendChild(script);
  }
  try{
    var module=await import("https://esm.sh/@supabase/supabase-js@2");
    if(typeof module.createClient!=="function")throw new Error("Supabase createClient export missing");
    window.supabase={createClient:module.createClient};
    startApp();
  }catch(error){loadUmd(0)}
})();
</script>
</body>
</html>
