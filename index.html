<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090610">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="description" content="QQCross — играй в сканворды">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css?v=20261106-connected34">
<title>QQCross</title>
</head>
<body>
<div id="app"><div class="boot-splash"><div class="boot-logo">QQ</div><p>Загрузка игры…</p></div></div>
<script>
(function(){
  function showBootError(message){
    var root=document.getElementById("app");
    if(!root || !root.textContent.includes("Загрузка игры")) return;
    root.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#08060f;color:#e5dce0;font:16px system-ui;text-align:center"><div><div style="font-size:42px;font-weight:800;color:#b9a4ed">QQ</div><h2>Не удалось запустить QQCross</h2><p style="color:#b9b2c5;max-width:320px">'+String(message||"Скрипт игры не запустился").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})+'</p><button onclick="location.reload()" style="border:0;border-radius:12px;padding:13px 22px;background:#8b70c9;color:#f0e5e8;font-weight:700">Обновить игру</button></div></div>';
  }
  window.addEventListener("error",function(e){showBootError(e.message+" ("+(e.filename||"")+(e.lineno?":"+e.lineno:"")+")")});
  window.addEventListener("unhandledrejection",function(e){var r=e.reason;showBootError(r&&r.message?r.message:String(r||"Ошибка запуска"))});
  setTimeout(function(){showBootError("Игра не завершила запуск за 15 секунд. Возможно, не загрузился один из файлов.")},15000);
})();
</script>
<script>
(function(){
  var urls=[
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js",
    "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"
  ];
  function startApp(){
    if(document.querySelector('script[data-qq-app]'))return;
    var app=document.createElement("script");
    app.src="./app.js?v=20261106-connected34";
    app.dataset.qqApp="true";
    app.onload=function(){};
    app.onerror=function(){window.dispatchEvent(new ErrorEvent("error",{message:"Не удалось загрузить app.js"}))};
    document.body.appendChild(app);
  }
  function load(index){
    if(index>=urls.length){
      window.QQ_SUPABASE_LOAD_ERROR=true;
      startApp();
      return;
    }
    var script=document.createElement("script");
    var settled=false;
    var timeout=setTimeout(function(){
      if(settled)return;
      settled=true;
      script.remove();
      load(index+1);
    },3500);
    script.src=urls[index];
    script.onload=function(){
      if(settled)return;
      settled=true;clearTimeout(timeout);
      if(window.supabase&&typeof window.supabase.createClient==="function")window.QQ_SUPABASE_READY?.();
      else load(index+1);
    };
    script.onerror=function(){
      if(settled)return;
      settled=true;clearTimeout(timeout);
      load(index+1);
    };
    document.head.appendChild(script);
  }
  startApp();
  load(0);
})();
</script>
</body>
</html>
