<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#32152e">
<script>
(function(){
  try{
    var palette=localStorage.getItem("qqcross_theme_v1");
    var savedMode=localStorage.getItem("qqcross_appearance_mode_v1");
    var supported=["burgundy","crimson","ember","amber","olive","forest","emerald","teal","lagoon","ocean","sapphire","indigo","purple","violet","plum","orchid","graphite"];
    var legacyLight=palette==="light"&&savedMode===null;
    var theme=supported.indexOf(palette)>=0?palette:(palette==="black"?"graphite":palette==="dark"?"purple":"burgundy");
    var mode=savedMode==="light"||legacyLight?"light":"dark";
    if(legacyLight)localStorage.setItem("qqcross_appearance_mode_v1","light");
    if(palette==="black"||palette==="dark"||palette==="light")localStorage.setItem("qqcross_theme_v1",theme);
    document.documentElement.dataset.qqTheme=theme;
    document.documentElement.dataset.qqMode=mode;
    document.documentElement.style.colorScheme=mode;
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta){var colors={burgundy:"#210710",crimson:"#200912",ember:"#211008",amber:"#201606",olive:"#191a0b",forest:"#0d1b13",emerald:"#081c18",teal:"#081b1d",lagoon:"#081923",ocean:"#0a1724",sapphire:"#0d1427",indigo:"#15112a",purple:"#170e20",violet:"#190d28",plum:"#210f20",orchid:"#210d1b",graphite:"#17191d"};meta.setAttribute("content",mode==="light"?"#f1f7fb":(colors[theme]||"#210710"));}
  }catch(_){}
})();
</script>

<body>
<div id="app"><div class="boot-splash" role="status" aria-live="polite">
  <div class="boot-scene" aria-hidden="true">
    <span class="boot-orbit boot-orbit-one"></span><span class="boot-orbit boot-orbit-two"></span>
    <div class="boot-mark"><span>QQ</span></div>
    <div class="boot-tiles"><i>С</i><i>Л</i><i>О</i><i>В</i><i>А</i></div>
  </div>
  <img class="boot-brand-logo" src="./assets/qqcross-logo.svg" alt="QQCross">
  <p class="boot-caption">Загрузка игры…</p>
  <div class="boot-progress" aria-hidden="true"><span></span></div>
  <div class="boot-footnote">Собираем слова и готовим поле</div>
</div></div>
<script>
(function(){
  function showBootError(message){
    var root=document.getElementById("app");
    if(!root || !root.textContent.includes("Загрузка игры")) return;
    root.innerHTML='<div class="qq-boot-error"><div><div class="qq-boot-error-mark">QQ</div><h2>Не удалось запустить QQCross</h2><p>'+String(message||"Скрипт игры не запустился").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})+'</p><button type="button" onclick="location.reload()">Обновить игру</button></div></div>';
  }
  window.addEventListener("error",function(e){showBootError(e.message+" ("+(e.filename||"")+(e.lineno?":"+e.lineno:"")+")")});
  window.addEventListener("unhandledrejection",function(e){var r=e.reason;showBootError(r&&r.message?r.message:String(r||"Ошибка запуска"))});
  setTimeout(function(){showBootError("Игра не завершила запуск за 15 секунд. Возможно, не загрузился один из файлов.")},15000);
})();
</script>

<script>
(function(){
  var urls=[
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js",
    "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"
  ];
  function startApp(){
    if(document.querySelector('script[data-qq-app]'))return;
    var app=document.createElement("script");
    app.src="./app.js?v=20261122-preserve-custom-avatar-v2";
    app.dataset.qqApp="true";
    app.onload=function(){};
    app.onerror=function(){window.dispatchEvent(new ErrorEvent("error",{message:"Не удалось загрузить app.js"}))};
    document.body.appendChild(app);
  }
  function load(index){
    if(index>=urls.length){
      window.QQ_SUPABASE_LOAD_ERROR=true;
      startApp();
      return;
    }
    var script=document.createElement("script");
    var settled=false;
    var timeout=setTimeout(function(){
      if(settled)return;
      settled=true;
      script.remove();
      load(index+1);
    },3500);
    script.src=urls[index];
    script.onload=function(){
      if(settled)return;
      settled=true;clearTimeout(timeout);
      if(window.supabase&&typeof window.supabase.createClient==="function")window.QQ_SUPABASE_READY?.();
      else load(index+1);
    };
    script.onerror=function(){
      if(settled)return;
      settled=true;clearTimeout(timeout);
      load(index+1);
    };
    document.head.appendChild(script);
  }
  startApp();
  load(0);
})();
</script>
</body>
