name: Generate Russian Wordle dictionary

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_wordle_dictionary.py'
      - '.github/workflows/generate-wordle-dictionary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache source dictionaries
        uses: actions/cache@v4
        with:
          path: .cache/wordle
          key: qqcross-wordle-source-v1
      - name: Build expanded Wordle dictionary
        run: python scripts/build_wordle_dictionary.py
      - name: Commit generated dictionary
        run: |
          if git diff --quiet -- data/wordle-words.json; then
            echo "Wordle dictionary is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wordle-words.json
          git commit -m "Expand Russian Wordle dictionary"
          git push
