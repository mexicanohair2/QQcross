name: Deploy QQCross to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qqcross-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static app
        run: |
          mkdir -p dist
          cp index.html app.js new-games.js progression.js encyclopedia.js audio.js wordle.js styles.css violet.css sw.js manifest.json icon.svg dist/
          cp -R data assets scanword-engine dist/
          test -f dist/scanword-engine/worker.js
          test -f dist/scanword-engine/src/generator.js
          test -f dist/scanword-engine/src/legacy-adapter.js
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
