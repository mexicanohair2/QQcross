name: Scanword 10k stress test

on:
  pull_request:
    branches: [main]
    paths:
      - "scanword-engine/**"
      - "data/scanword-dictionary.json"
      - "scripts/stress-scanword.cjs"
      - ".github/workflows/scanword-stress.yml"

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 10,000 sequential full-grid generations
        run: node scripts/stress-scanword.cjs 10000
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqcross-scanword-stress-${{ github.run_number }}
          path: artifacts/scanword-stress-10000.json
          if-no-files-found: warn
          retention-days: 30
