name: Validate QQcross

concurrency:
  group: qqcross-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, fix/reference-scanword-8x12]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check wordle.js
          node --check new-games.js
          node --check progression.js
          node --check encyclopedia.js
          node --check scripts/verify-scanword.cjs
          node --check scripts/validate-scanwords.js
          python -m py_compile scripts/scanword_audit.py
      - name: Validate scanword data
        run: node scripts/validate-scanwords.js
      - name: Verify 20 generated scanwords against the reference rules
        run: node scripts/verify-scanword.cjs
