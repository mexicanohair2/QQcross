name: Scanword engine unit tests

on:
  push:
    branches:
      - feature/qqcross-scanword-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scanword-engine-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanword-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated engine tests
        run: npm test
      - name: Audit the real QQCross dictionary
        run: npm run audit
