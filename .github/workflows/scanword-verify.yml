name: Scanword verification

concurrency:
  group: qqcross-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feature/qqcross-scanword-engine]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Diagnose one constrained production generation with an extended search budget
        run: node scripts/diagnose-scanword.cjs
      - name: Search compatible eleven-letter answers and their crossing words
        run: node scripts/diagnose-special-candidates.cjs
      - name: Audit topology slot lengths before dictionary assignment
        run: node scripts/diagnose-topologies.mjs
      - name: Validate redesigned low-short-slot 8x12 topology
        run: node scripts/diagnose-custom-topology.mjs
      - name: Validate seeded 8x12 topology sampling
        run: node scripts/diagnose-border-compatible-topology.cjs
      - name: First gate — 20 seeded puzzles with independent validation
        run: node scripts/verify-scanword-smoke.cjs
      - name: Stress-test 100 consecutive full 8x12 scanwords with a production search budget
        run: node scripts/diagnose-normal-batch.cjs
      - name: Preserve seeded scanword validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqcross-scanword-validation-${{ github.run_number }}
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
