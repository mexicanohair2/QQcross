name: QQCross browser regression tests

on:
  push:
    branches:
      - feature/qqcross-scanword-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qqcross-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile end-to-end tests
        run: npm run test:e2e -- --reporter=list
