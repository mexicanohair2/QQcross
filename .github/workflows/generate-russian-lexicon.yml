name: Build 100,000-word Russian lexicon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate the 100k lexicon
        run: |
          python scripts/build_russian_lexicon.py
          python scripts/validate_russian_lexicon.py
      - name: Commit generated dictionary
        run: |
          git add data/russian-words-100000.json data/russian-words-common-25000.json
          if git diff --cached --quiet; then
            echo "The 100k lexicon is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build 100,000-word Russian lexicon"
            git push
          fi
